<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Surge Feature Graphic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;800;900&display=swap');

  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: #0D0D0D;
    font-family: 'Inter', sans-serif;
  }

  .container {
    width: 1024px;
    height: 500px;
    display: flex;
    align-items: center;
    position: relative;
    background: linear-gradient(135deg, #1A1A1A 0%, #0D0D0D 60%);
  }

  /* Left block — branding */
  .left {
    padding-left: 72px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 2;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  /* Lightning bolt SVG — matches the app icon */
  .bolt svg {
    width: 56px;
    height: 56px;
    filter: drop-shadow(0 0 20px rgba(255, 77, 0, 0.4));
  }

  .app-name {
    font-size: 72px;
    font-weight: 900;
    color: #FFFFFF;
    letter-spacing: 3px;
    line-height: 1;
  }

  .tagline {
    font-size: 22px;
    font-weight: 400;
    color: #A0A0A0;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  .sub-tagline {
    font-size: 15px;
    font-weight: 400;
    color: #666666;
    margin-top: 2px;
  }

  /* Accent line */
  .accent-line {
    position: absolute;
    left: 525px;
    top: 15%;
    height: 70%;
    width: 2px;
    background: linear-gradient(to bottom, transparent, #FF4D00, transparent);
    opacity: 0.6;
  }

  /* Right block — phone mockup */
  .right {
    position: absolute;
    left: 650px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
  }

  .phone {
    width: 210px;
    height: 420px;
    background: #111111;
    border-radius: 32px;
    border: 3px solid #444;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 50px rgba(255,77,0,0.1);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .phone-notch {
    width: 70px;
    height: 5px;
    background: #444;
    border-radius: 3px;
    margin: 2px auto 6px;
  }

  /* Mini UI inside phone */
  .phone-header {
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    padding: 0 6px;
    letter-spacing: 0.3px;
  }

  .phone-card {
    background: #1E1E1E;
    border-radius: 12px;
    border: 1px solid #2A2A2A;
    padding: 10px;
  }

  .macro-bars {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .macro-bar {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .macro-label {
    font-size: 9px;
    font-weight: 800;
    color: #777;
    width: 32px;
    letter-spacing: 0.8px;
  }

  .bar-track {
    flex: 1;
    height: 7px;
    background: #2A2A2A;
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
  }

  .bar-cal  { width: 72%; background: #FF4D00; }
  .bar-pro  { width: 85%; background: #00D26A; }
  .bar-carb { width: 60%; background: #4A9EFF; }
  .bar-fat  { width: 45%; background: #FFB800; }

  .macro-val {
    font-size: 9px;
    font-weight: 800;
    color: #bbb;
    width: 28px;
    text-align: right;
  }

  .workout-card {
    background: #1E1E1E;
    border-radius: 12px;
    border: 1px solid #2A2A2A;
    padding: 10px;
  }

  .workout-title {
    font-size: 9px;
    font-weight: 800;
    color: #FF4D00;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .workout-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    font-weight: 500;
    color: #ddd;
    padding: 3px 0;
    border-bottom: 1px solid #222;
  }

  .workout-row:last-child {
    border-bottom: none;
  }

  .workout-set {
    color: #888;
    font-size: 9px;
    font-weight: 700;
  }

  .food-card {
    background: #1E1E1E;
    border-radius: 12px;
    border: 1px solid #2A2A2A;
    padding: 10px;
  }

  .food-title {
    font-size: 9px;
    font-weight: 800;
    color: #00D26A;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .food-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    font-weight: 500;
    color: #ddd;
    padding: 3px 0;
    border-bottom: 1px solid #222;
  }

  .food-row:last-child {
    border-bottom: none;
  }

  .food-kcal {
    color: #888;
    font-size: 9px;
    font-weight: 700;
  }

  .mic-bar {
    display: flex;
    justify-content: center;
    margin-top: auto;
    padding-top: 4px;
  }

  .mic-dot {
    width: 32px;
    height: 32px;
    background: #FF4D00;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    box-shadow: 0 0 16px rgba(255,77,0,0.5);
  }

  /* Subtle glow behind phone */
  .glow {
    position: absolute;
    left: 560px;
    top: 50%;
    transform: translateY(-50%);
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,77,0,0.06) 0%, transparent 70%);
    border-radius: 50%;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="logo-row">
        <div class="bolt">
          <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M330 10L120 280H240L180 500L400 220H275L330 10Z" fill="#FF4D00"/>
          </svg>
        </div>
        <div class="app-name">SURGE</div>
      </div>
      <div class="tagline">Gym + Nutrition. One App.</div>
      <div class="sub-tagline">Log workouts &amp; food by voice, photo, or tap</div>
    </div>

    <div class="accent-line"></div>
    <div class="glow"></div>

    <div class="right">
      <div class="phone">
        <div class="phone-notch"></div>
        <div class="phone-header">Today</div>

        <div class="phone-card">
          <div class="macro-bars">
            <div class="macro-bar">
              <span class="macro-label">KCAL</span>
              <div class="bar-track"><div class="bar-fill bar-cal"></div></div>
              <span class="macro-val">1840</span>
            </div>
            <div class="macro-bar">
              <span class="macro-label">PROT</span>
              <div class="bar-track"><div class="bar-fill bar-pro"></div></div>
              <span class="macro-val">128g</span>
            </div>
            <div class="macro-bar">
              <span class="macro-label">CARB</span>
              <div class="bar-track"><div class="bar-fill bar-carb"></div></div>
              <span class="macro-val">180g</span>
            </div>
            <div class="macro-bar">
              <span class="macro-label">FAT</span>
              <div class="bar-track"><div class="bar-fill bar-fat"></div></div>
              <span class="macro-val">52g</span>
            </div>
          </div>
        </div>

        <div class="workout-card">
          <div class="workout-title">Chest Day</div>
          <div class="workout-row">
            <span>Bench Press</span>
            <span class="workout-set">80kg × 8</span>
          </div>
          <div class="workout-row">
            <span>Incline DB</span>
            <span class="workout-set">30kg × 10</span>
          </div>
          <div class="workout-row">
            <span>Cable Fly</span>
            <span class="workout-set">25kg × 12</span>
          </div>
        </div>

        <div class="food-card">
          <div class="food-title">Food Log</div>
          <div class="food-row">
            <span>Paneer Sabzi</span>
            <span class="food-kcal">280 kcal</span>
          </div>
          <div class="food-row">
            <span>2 Roti</span>
            <span class="food-kcal">160 kcal</span>
          </div>
        </div>

        <div class="mic-bar">
          <div class="mic-dot">🎤</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
